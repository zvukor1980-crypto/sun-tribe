<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Обновить «Племя Солнца»</title><style>body{font:17px system-ui;background:#153d48;color:#fff0d0;padding:calc(24px + env(safe-area-inset-top)) 22px;max-width:480px;margin:auto;line-height:1.6}button,a{display:block;padding:15px 20px;margin:16px 0;border-radius:14px;background:#ebcd88;color:#163c45;border:0;font:600 17px system-ui;text-align:center}button:disabled{opacity:.6}small{display:block;color:#cee0db}</style><h1>Племя Солнца</h1><p>Установить версию 3.0.3</p><button id="update">Обновить игру</button><p id="status" role="status">Сохранения и фотоальбом не удаляются.</p><a href="./index.html">Открыть игру</a><small>Если игра установлена значком на экране iPhone: обновление в Safari может не затронуть её отдельный кеш. Открой игру со значка с интернетом, подожди немного, затем полностью закрой и открой снова.</small><script>
const button=document.getElementById('update'),statusEl=document.getElementById('status');
button.onclick=async()=>{button.disabled=true;statusEl.textContent='Загружаю обновление…';let timer;try{
await Promise.race([(async()=>{if(!('serviceWorker' in navigator))throw Error('unsupported');const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});await reg.update();const worker=reg.installing||reg.waiting;if(worker&&worker.state!=='activated')await new Promise((resolve,reject)=>{const check=()=>{if(worker.state==='activated')resolve();if(worker.state==='redundant')reject(Error('install'));};worker.addEventListener('statechange',check);check();});})(),new Promise((_,reject)=>timer=setTimeout(()=>reject(Error('timeout')),20000))]);
statusEl.textContent='Обновление готово для этого браузера. Нажми «Открыть игру».';
}catch(e){statusEl.textContent='Не удалось завершить обновление. Проверь интернет и нажми ещё раз.';}finally{clearTimeout(timer);button.disabled=false;}};
</script></html>
